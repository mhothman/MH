version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: proflow-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-proflow123}
      - MONGO_INITDB_DATABASE=${DB_NAME:-proflow}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - proflow-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proflow-backend
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-proflow123}@mongodb:27017/${DB_NAME:-proflow}?authSource=admin
      - DB_NAME=${DB_NAME:-proflow}
      - JWT_SECRET=${JWT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SENDER_EMAIL=${SENDER_EMAIL}
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8001:8001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - proflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL}
    container_name: proflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - proflow-network

networks:
  proflow-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
